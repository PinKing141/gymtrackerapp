// ─── PERSISTENT STORAGE ───
function dbLoad() { try { const r = localStorage.getItem(DB); return r ? {...DD(),...JSON.parse(r)} : DD(); } catch(e){ return DD(); } }
function dbSave(d) { try { localStorage.setItem(DB, JSON.stringify(d)); } catch(e){} }

// ─── STABLE COMPONENTS (defined once at module level) ───
function RestTimer({seconds,color}) {
  const [rem,setRem]=useState(seconds);const [on,setOn]=useState(false);const r=useRef(null);
  useEffect(()=>()=>clearInterval(r.current),[]);
  const go=()=>{if(on){clearInterval(r.current);setOn(false);setRem(seconds);return;}setOn(true);setRem(seconds);r.current=setInterval(()=>{setRem(p=>{if(p<=1){clearInterval(r.current);setOn(false);return seconds;}return p-1;});},1000);};
  const m=Math.floor(rem/60),s=rem%60;
  return <button onClick={go} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:8,border:"none",cursor:"pointer",minWidth:72,background:on?`${color}22`:"rgba(255,255,255,0.04)",color:on?color:"#666",fontSize:12,fontWeight:600,position:"relative",overflow:"hidden"}}>{on&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:`${(rem/seconds)*100}%`,background:`${color}15`,transition:"width 1s linear"}}/>}<span style={{position:"relative",zIndex:1}}>{on?`${m}:${s.toString().padStart(2,"0")}`:`⏱ ${seconds>=60?seconds/60+"m":seconds+"s"}`}</span></button>;
}

function Spark({data,color,height=40}) {
  if(!data||data.length<2) return null;
  const mx=Math.max(...data),mn=Math.min(...data),rng=mx-mn||1,w=200;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${height-((v-mn)/rng)*(height-4)-2}`).join(" ");
  return <svg viewBox={`0 0 ${w} ${height}`} style={{width:"100%",height}} preserveAspectRatio="none"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><circle cx={w} cy={height-((data[data.length-1]-mn)/rng)*(height-4)-2} r="3" fill={color}/></svg>;
}

function LiveTimer({color,ts,onUpdate}) {
  const [now,setNow]=useState(Date.now());
  const {running,startedAt,lastResumedAt,accumulated}=ts;
  useEffect(()=>{if(!running) return;const id=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(id);},[running]);
  const cur=running&&lastResumedAt?Math.floor((now-lastResumedAt)/1000):0;
  const tot=accumulated+cur,h=Math.floor(tot/3600),m=Math.floor((tot%3600)/60),s=tot%60;
  const pad=n=>n.toString().padStart(2,"0");
  const disp=h>0?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;
  const fresh=!startedAt;
  const toggle=()=>{if(running){onUpdate({running:false,startedAt,lastResumedAt:null,accumulated:accumulated+Math.floor((Date.now()-lastResumedAt)/1000)});}else{const t=Date.now();onUpdate({running:true,startedAt:startedAt||t,lastResumedAt:t,accumulated});}};
  return <div style={{position:"sticky",top:0,zIndex:50,background:"rgba(10,10,15,0.95)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",borderBottom:`1px solid ${running?color+"33":"rgba(255,255,255,0.06)"}`,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
    <button onClick={toggle} style={{display:"flex",alignItems:"center",gap:8,background:fresh?color:running?"rgba(255,255,255,0.06)":`${color}22`,border:"none",borderRadius:10,padding:"8px 14px",cursor:"pointer"}}>
      {running?<svg width={14} height={14} viewBox="0 0 24 24" fill={color}><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>:<svg width={14} height={14} viewBox="0 0 24 24" fill={fresh?"#fff":color}><polygon points="5,3 19,12 5,21"/></svg>}
      <span style={{fontSize:12,fontWeight:700,color:fresh?"#fff":running?"#999":color}}>{fresh?"Start":running?"Pause":"Resume"}</span>
    </button>
    <div style={{display:"flex",alignItems:"center",gap:8}}>
      {running&&<div style={{width:7,height:7,borderRadius:"50%",background:color,boxShadow:`0 0 8px ${color}88`,animation:"pulse 2s ease-in-out infinite"}}/>}
      <div style={{background:running?`${color}15`:"rgba(255,255,255,0.04)",borderRadius:10,padding:"5px 14px",border:`1px solid ${running?color+"30":"rgba(255,255,255,0.08)"}`}}>
        <span style={{fontSize:22,fontWeight:800,color:fresh?"#444":"#fff",fontVariantNumeric:"tabular-nums",fontFamily:"'SF Mono','Menlo',monospace",letterSpacing:"0.04em"}}>{disp}</span>
      </div>
    </div>
    <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}`}</style>
  </div>;
}

// KEY FIX: ExerciseCard is a stable top-level component. Inputs will NOT remount.
function ExerciseCard({ex,exKey,setsArr,isOpen,onToggle,onSet,color,prevSets}) {
  const filled=setsArr.filter(s=>s.kg||s.reps).length, done=filled===ex.sets;
  return <div style={{...C,padding:0,overflow:"hidden",background:done?"rgba(69,182,73,0.05)":C.background,borderColor:done?"rgba(69,182,73,0.18)":"rgba(255,255,255,0.06)"}}>
    <button onClick={()=>onToggle(exKey)} style={{width:"100%",textAlign:"left",background:"none",border:"none",color:"#E8E6E1",padding:"13px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6}}>{done&&<span style={{color:"#45B649",fontSize:13}}>✓</span>}<span style={{fontSize:13,fontWeight:600,color:done?"#45B649":"#fff"}}>{ex.name}</span></div><p style={{fontSize:10,color:"#555",margin:"2px 0 0"}}>{ex.type} · {ex.sets}×{ex.reps} · {ex.restLabel}</p></div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>{filled>0&&!done&&<span style={{fontSize:9,color:"#888",background:"rgba(255,255,255,0.06)",padding:"2px 6px",borderRadius:6}}>{filled}/{ex.sets}</span>}<span style={{color:"#555",fontSize:16,transform:isOpen?"rotate(90deg)":"none",transition:"transform 0.2s"}}>›</span></div>
    </button>
    {isOpen&&<div style={{padding:"0 14px 12px"}}>
      <div style={{display:"grid",gridTemplateColumns:"28px 1fr 1fr auto",gap:"5px 6px",alignItems:"center"}}>
        <span style={{fontSize:9,color:"#444",textAlign:"center"}}>SET</span><span style={{fontSize:9,color:"#444"}}>KG</span><span style={{fontSize:9,color:"#444"}}>REPS</span><span style={{fontSize:9,color:"#444"}}>REST</span>
        {setsArr.map((s,si)=><SetRow key={`${exKey}-s${si}`} exKey={exKey} si={si} s={s} ex={ex} color={color} onSet={onSet}/>)}
      </div>
      {prevSets&&prevSets.some(s=>s.kg)&&<button onClick={()=>prevSets.forEach((p,si)=>{if(p.kg)onSet(exKey,si,"kg",p.kg);if(p.reps)onSet(exKey,si,"reps",p.reps);})} style={{marginTop:8,width:"100%",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:8,padding:"8px",color:"#777",fontSize:11,cursor:"pointer",fontWeight:500}}>📋 Copy last ({prevSets.filter(s=>s.kg).map(s=>`${s.kg}kg`).join(", ")})</button>}
    </div>}
  </div>;
}

function SetRow({exKey,si,s,ex,color,onSet}) {
  return <>
    <span style={{fontSize:12,color:"#555",textAlign:"center",fontWeight:600}}>{si+1}</span>
    <input type="number" inputMode="decimal" placeholder="—" value={s.kg} onChange={e=>onSet(exKey,si,"kg",e.target.value)} style={IS}/>
    <input type="number" inputMode="numeric" placeholder={ex.reps.replace(/[^0-9]/g,"")||"—"} value={s.reps} onChange={e=>onSet(exKey,si,"reps",e.target.value)} style={IS}/>
    {ex.rest>0?<RestTimer seconds={ex.rest} color={color}/>:<span style={{fontSize:10,color:"#444",textAlign:"center"}}>Full</span>}
  </>;
}

  const [sess,setSess]=useState(null);
  const [hd,setHd]=useState(null);
  const [sv,setSv]=useState(null);
  const [exp,setExp]=useState(null);
  const [sp,setSp]=useState(true);
  const [sc,setSc]=useState(false);
  const [rf,setRf]=useState(null);
  const [bf,setBf]=useState(null);
  const [rvf,setRvf]=useState(null);
  const sr=useRef(null);
  const st=useRef(null);

  ;
  useEffect(()=>{clearTimeout(st.current);st.current=setTimeout(()=>dbSave(app),400);},[app]);
  useEffect(()=>{sr.current?.scrollTo(0,0);},[view,sv]);

  const rMore=()=>{
    if(sv==="recovery"&&rf){ return <div style={{padding:"0 20px"}}><div style={{paddingTop:52}}><button onClick={()=>{setSv(null);setRf(null);}} style={BB}>← Back</button><h2 style={{fontSize:21,fontWeight:700,margin:0}}>Recovery Log</h2><p style={{fontSize:11,color:"#555",margin:"4px 0 20px"}}>{fd(today())}</p>
      <div style={C}><p style={{fontSize:12,color:"#999",margin:"0 0 8px"}}>Sleep (hours)</p><div style={{display:"flex",alignItems:"center",gap:10}}><input type="range" min="3" max="12" step="0.5" value={rf.sleep} onChange={e=>setRf(p=>({...p,sleep:+e.target.value}))} style={{flex:1,accentColor:"#2D7DD2"}}/><span style={{fontSize:18,fontWeight:700,color:rf.sleep>=8?"#45B649":rf.sleep>=7?"#F5A623":"#E84545",minWidth:36,textAlign:"right"}}>{rf.sleep}h</span></div><p style={{fontSize:9,color:"#444",marginTop:4,marginBottom:0}}>Target: 8+ hours</p></div>
      <div style={C}><p style={{fontSize:12,color:"#999",margin:"0 0 8px"}}>Water (litres)</p><div style={{display:"flex",gap:6}}>{[1,1.5,2,2.5,3,3.5,4,4.5].map(v=><button key={v} onClick={()=>setRf(p=>({...p,water:v}))} style={{flex:1,padding:"8px 0",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,background:rf.water===v?"rgba(45,125,210,0.2)":"rgba(255,255,255,0.04)",color:rf.water===v?"#2D7DD2":"#555"}}>{v}</button>)}</div></div>
      <div style={C}><button onClick={()=>setRf(p=>({...p,mobilityDone:!p.mobilityDone}))} style={{width:"100%",background:"none",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",color:"#E8E6E1",padding:0}}><span style={{fontSize:13,fontWeight:600,color:rf.mobilityDone?"#45B649":"#fff"}}>{rf.mobilityDone?"✓ ":""}Post-Session Mobility</span><div style={{width:20,height:20,borderRadius:6,border:`2px solid ${rf.mobilityDone?"#45B649":"#555"}`,background:rf.mobilityDone?"#45B649":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{rf.mobilityDone&&<span style={{color:"#000",fontSize:12,fontWeight:700}}>✓</span>}</div></button></div>
      <button onClick={()=>{setApp(p=>{const r=[...p.recovery];const i=r.findIndex(x=>x.date===rf.date);if(i>=0)r[i]=rf;else r.push(rf);return{...p,recovery:r};});setSv(null);setRf(null);}} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:"#2D7DD2",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",marginTop:10}}>Save</button>
      {app.recovery.length>=2&&<div style={{...C,marginTop:20}}><p style={{fontSize:12,fontWeight:600,color:"#fff",margin:"0 0 6px"}}>Sleep Trend</p><Spark data={app.recovery.slice(-14).map(r=>r.sleep)} color="#2D7DD2" height={36}/></div>}
    </div></div>;}
    if(sv==="bodystats"){if(!bf)setBf({date:today(),weight:app.bodyStats.length?app.bodyStats[app.bodyStats.length-1].weight:210});const b=bf||{date:today(),weight:210}; return <div style={{padding:"0 20px"}}><div style={{paddingTop:52}}><button onClick={()=>{setSv(null);setBf(null);}} style={BB}>← Back</button><h2 style={{fontSize:21,fontWeight:700,margin:0}}>Body Stats</h2>
      <div style={{...C,marginTop:20}}><p style={{fontSize:12,color:"#999",margin:"0 0 8px"}}>Bodyweight (lbs)</p><input type="number" inputMode="decimal" value={b.weight} onChange={e=>setBf(p=>({...p,weight:+e.target.value}))} style={{...IS,fontSize:22,textAlign:"center",padding:"14px"}}/><p style={{fontSize:9,color:"#444",marginTop:6,marginBottom:0}}>Target: 201–220 lbs</p></div>
      <button onClick={()=>{setApp(p=>{const a=[...p.bodyStats];const i=a.findIndex(x=>x.date===b.date);if(i>=0)a[i]=b;else a.push(b);return{...p,bodyStats:a};});setSv(null);setBf(null);}} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:"#F5A623",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",marginTop:10}}>Save</button>
      {app.bodyStats.length>0&&<div style={{...C,marginTop:20}}><p style={{fontSize:12,fontWeight:600,color:"#fff",margin:"0 0 6px"}}>History</p>{app.bodyStats.length>=2&&<Spark data={app.bodyStats.slice(-12).map(d=>d.weight)} color="#F5A623" height={36}/>}<div style={{marginTop:8}}>{[...app.bodyStats].reverse().slice(0,8).map((b,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid rgba(255,255,255,0.03)"}}><span style={{fontSize:11,color:"#666"}}>{fd(b.date)}</span><span style={{fontSize:12,fontWeight:600,color:"#fff"}}>{b.weight} lbs</span></div>)}</div></div>}
    </div></div>;}
    if(sv==="review"&&rvf){ return <div style={{padding:"0 20px"}}><div style={{paddingTop:52}}><button onClick={()=>{setSv(null);setRvf(null);}} style={BB}>← Back</button><h2 style={{fontSize:21,fontWeight:700,margin:0}}>Weekly Review</h2>
      {WQ.map((q,i)=><div key={i} style={{...C,marginBottom:10}}><p style={{fontSize:12,color:"#F5A623",fontWeight:600,margin:"0 0 8px"}}>{q}</p><textarea value={rvf[i]} onChange={e=>{const a=[...rvf];a[i]=e.target.value;setRvf(a);}} placeholder="Your answer..." style={{width:"100%",boxSizing:"border-box",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:8,padding:"10px",color:"#ccc",fontSize:12,minHeight:52,resize:"vertical",fontFamily:"inherit",outline:"none"}}/></div>)}
      <button onClick={()=>{setApp(p=>({...p,weeklyReviews:[...p.weeklyReviews,{date:today(),answers:rvf}]}));setSv(null);setRvf(null);}} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:"#F5A623",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",marginTop:6}}>Submit</button>
      {app.weeklyReviews.length>0&&<>{[...app.weeklyReviews].reverse().slice(0,3).map((r,i)=><div key={i} style={{...C,marginTop:i===0?16:0}}><p style={{fontSize:12,fontWeight:600,color:"#fff",margin:0}}>{fd(r.date)}</p>{r.answers.map((a,j)=>a?<p key={j} style={{fontSize:11,color:"#888",margin:"4px 0 0"}}><span style={{color:"#F5A623"}}>Q{j+1}:</span> {a}</p>:null)}</div>)}</>}
    </div></div>;}
    if(sv==="phase"){const{phase,week,deload}=gp(); return <div style={{padding:"0 20px"}}><div style={{paddingTop:52}}><button onClick={()=>setSv(null)} style={BB}>← Back</button><h2 style={{fontSize:21,fontWeight:700,margin:0}}>12-Week Cycle</h2><p style={{fontSize:11,color:"#555",margin:"4px 0 20px"}}>{app.phaseStart?`Started ${fd(app.phaseStart)}`:"Starts on first session"}</p>
      <div style={C}><div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:12,color:"#fff",fontWeight:600}}>Week {week}/12</span>{deload&&<span style={{fontSize:10,color:"#F5A623",fontWeight:700,background:"rgba(245,166,35,0.15)",padding:"2px 8px",borderRadius:6}}>DELOAD</span>}</div><div style={{display:"flex",gap:3}}>{Array.from({length:12},(_,i)=>{const w=i+1,p=w<=4?0:w<=8?1:2; return <div key={i} style={{flex:1,height:(w===4||w===8||w===12)?20:24,borderRadius:4,background:w<=week?PHASES[p].color:"rgba(255,255,255,0.04)",opacity:w<=week?1:0.3,border:w===week?"2px solid #fff":"none",boxSizing:"border-box"}}/>;})}</div></div>
      {PHASES.map((p,i)=><div key={i} style={{...C,background:i===phase?`${p.color}10`:C.background,borderColor:i===phase?`${p.color}40`:"rgba(255,255,255,0.06)"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><p style={{fontSize:13,fontWeight:700,margin:0,color:i===phase?p.color:"#fff"}}>Phase {i+1} — {p.name}</p><p style={{fontSize:11,color:"#666",margin:"2px 0 0"}}>Weeks {p.weeks}</p><p style={{fontSize:11,color:"#888",margin:"4px 0 0",fontStyle:"italic"}}>{p.theme}</p></div>{i<phase&&<span style={{fontSize:16,color:"#45B649"}}>✓</span>}{i===phase&&<span style={{fontSize:10,color:p.color,fontWeight:700,background:`${p.color}22`,padding:"3px 8px",borderRadius:6}}>ACTIVE</span>}</div>{i===phase&&deload&&<div style={{marginTop:10,padding:"8px 10px",background:"rgba(245,166,35,0.08)",borderRadius:8,border:"1px solid rgba(245,166,35,0.15)"}}><p style={{fontSize:11,color:"#F5A623",margin:0,fontWeight:600}}>⚡ Deload Active</p><p style={{fontSize:10,color:"#888",margin:"3px 0 0"}}>Weights -40% · Conditioning -50% · Keep prehab · Sleep 9hrs</p></div>}</div>)}
      {!app.phaseStart&&<button onClick={()=>setApp(p=>({...p,phaseStart:today()}))} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:"#2D7DD2",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",marginTop:10}}>Start Cycle</button>}
      {app.phaseStart&&<button onClick={()=>{if(confirm('Reset cycle start date?'))setApp(p=>({...p,phaseStart:today()}));}} style={{width:"100%",marginTop:10,padding:"11px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#888",fontSize:12,cursor:"pointer"}}>Reset Cycle</button>}
    </div></div>;}
     return <div style={{padding:"0 20px"}}><div style={{paddingTop:56,marginBottom:20}}><h2 style={{fontSize:21,fontWeight:700,margin:0}}>More</h2></div>
      {[{k:"recovery",i:"😴",t:"Recovery Log",d:"Sleep, hydration, mobility"},{k:"bodystats",i:"⚖️",t:"Body Stats",d:"Bodyweight check-in"},{k:"review",i:"📋",t:"Weekly Review",d:"Sunday accountability"},{k:"phase",i:"📈",t:"Phase Tracker",d:"12-week progression"}].map(x=><button key={x.k} onClick={()=>{setSv(x.k);if(x.k==="recovery")setRf(app.recovery.find(r=>r.date===today())||{date:today(),sleep:8,water:3,mobilityDone:false});if(x.k==="bodystats")setBf({date:today(),weight:app.bodyStats.length?app.bodyStats[app.bodyStats.length-1].weight:210});if(x.k==="review")setRvf(WQ.map(()=>""));}} style={{...C,width:"100%",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:14}}><span style={{fontSize:24}}>{x.i}</span><div style={{flex:1}}><p style={{fontSize:14,fontWeight:600,margin:0,color:"#fff"}}>{x.t}</p><p style={{fontSize:11,color:"#555",margin:"2px 0 0"}}>{x.d}</p></div><span style={{color:"#555",fontSize:18}}>›</span></button>)}
      <div style={{...C,marginTop:16}}><p style={{fontSize:11,color:"#555",margin:"0 0 8px",letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600}}>Data</p><div style={{fontSize:12,color:"#888"}}><p style={{margin:"3px 0"}}>{app.sessions.length} sessions · {app.recovery.length} recovery logs</p><p style={{margin:"3px 0"}}>{app.bodyStats.length} weigh-ins · {app.weeklyReviews.length} reviews · {Object.keys(app.personalBests).length} PBs</p></div></div>
      <button onClick={()=>{if(confirm('Clear ALL data?')){try{localStorage.removeItem(DB);}catch(e){}setApp(DD());}}} style={{width:"100%",marginTop:10,padding:"11px",borderRadius:10,border:"1px solid rgba(232,69,69,0.2)",background:"rgba(232,69,69,0.05)",color:"#E84545",fontSize:12,cursor:"pointer"}}>Reset All Data</button>
    </div>;
  };

   return <div style={{maxWidth:430,margin:"0 auto",minHeight:"100dvh",background:"#0A0A0F",color:"#E8E6E1",fontFamily:"'SF Pro Display',-apple-system,system-ui,sans-serif",position:"relative"}}>
    <div ref={sr} style={{height:"100dvh",overflowY:"auto",paddingBottom:90,WebkitOverflowScrolling:"touch"}}>
      {view==="home"&&rHome()}
      {view==="log"&&rLog()}
      {view==="history"&&rHist()}
      {view==="progress"&&rProg()}
      {view==="pbs"&&rPBs()}
      {view==="more"&&rMore()}
    </div>
    {view!=="log"&&<div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(10,10,15,0.94)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderTop:"1px solid rgba(255,255,255,0.06)",display:"flex",justifyContent:"space-around",padding:"6px 0 env(safe-area-inset-bottom, 6px)",zIndex:100}}>
      {NAV.map(n=><button key={n.id} onClick={()=>{setView(n.id);setHd(null);setSv(null);setRf(null);setBf(null);setRvf(null);}} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,background:"none",border:"none",cursor:"pointer",padding:"5px 12px",color:view===n.id?"#fff":"#555",fontSize:9,fontWeight:500,letterSpacing:"0.02em"}}><NI d={n.icon}/><span>{n.l}</span></button>)}
    </div>}
  </div>;
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
