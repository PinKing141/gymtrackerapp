<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orion Gym">
<meta name="theme-color" content="#0A0A0F">
<meta name="description" content="Track workouts, personal bests, recovery, and 12-week training phases in Orion Gym Tracker.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="%BASE_URL%manifest.webmanifest">
<link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png">
<title>Orion Gym Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;width:100%;background:#0A0A0F;overflow:hidden;}
body{font-family:'SF Pro Display',-apple-system,system-ui,sans-serif;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{appearance:textfield;-moz-appearance:textfield;}
.app-boot-fallback{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;color:#F7F8FA;font-family:'SF Pro Display',-apple-system,system-ui,sans-serif;}
.app-boot-card{width:100%;max-width:360px;padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(255,255,255,.04);text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35);}
.app-boot-card h1{font-size:20px;margin:12px 0 6px;}
.app-boot-card p{font-size:13px;line-height:1.4;color:#A7ABB8;margin:0;}
.app-boot-spinner{width:32px;height:32px;margin:0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:#4EA1FF;animation:app-boot-spin .9s linear infinite;}
@keyframes app-boot-spin{to{transform:rotate(360deg)}}
/* Keyboard focus is always visible, independent of any component's own styling. */
:focus-visible{outline:2px solid #4EA1FF;outline-offset:2px;}
@keyframes skeleton-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.12) 37%,rgba(255,255,255,.06) 63%);background-size:400% 100%;animation:skeleton-shimmer 1.6s ease-in-out infinite;border-radius:10px;}
/* Respect the OS-level "reduce motion" setting: stop shimmer/keyframe motion and
   collapse transitions app-wide instead of auditing every animated component. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
}
</style>
</head>
<body>
<div id="root">
  <div class="app-boot-fallback" role="status" aria-live="polite">
    <div class="app-boot-card">
      <div class="app-boot-spinner" aria-hidden="true"></div>
      <h1>Loading Orion Gym…</h1>
      <p>If this stays here, refresh the page to download the latest app files.</p>
    </div>
  </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
