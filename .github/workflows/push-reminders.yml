name: Push training reminders

# Runs the Web Push reminder sender on a schedule. Free — no always-on server.
on:
  schedule:
    # 17:00 UTC daily. Adjust to a time that suits your users; cron is UTC.
    - cron: "0 17 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server deps
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Send reminders
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node sendReminders.js
